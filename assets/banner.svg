<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090e" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.0" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.55" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="260" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="2" />
  <rect width="1000" height="260" rx="16" fill="url(#grid)" />
  <circle cx="850" cy="60" r="220" fill="url(#glow)" />
  <circle cx="140" cy="220" r="180" fill="url(#glow)" />

  <!-- Top Terminal Bar -->
  <rect x="24" y="20" width="952" height="34" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1" />
  <circle cx="44" cy="37" r="5.5" fill="#ef4444" />
  <circle cx="62" cy="37" r="5.5" fill="#f59e0b" />
  <circle cx="80" cy="37" r="5.5" fill="#10b981" />
  <text x="500" y="42" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="12.5" fill="#94a3b8" text-anchor="middle">
    igor@station:~ — igor.carlos() — bash
  </text>

  <!-- Status Pill -->
  <rect x="780" y="26" width="182" height="22" rx="11" fill="#064e3b" fill-opacity="0.6" stroke="#10b981" stroke-width="1" />
  <circle cx="795" cy="37" r="4" fill="#34d399">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="807" y="41" font-family="'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#a7f3d0">
    São Paulo, Brasil • Online
  </text>

  <!-- Main Heading -->
  <text x="52" y="112" font-family="'Space Grotesk', 'Segoe UI', Ubuntu, sans-serif" font-size="40" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
    Igor Carlos Dias
  </text>

  <text x="52" y="148" font-family="'Inter', 'Segoe UI', Ubuntu, sans-serif" font-size="21" font-weight="700" fill="url(#accent)">
    Analista de Sistemas MES &amp; Desenvolvedor Back-End
  </text>

  <!-- Subtitle / Bio -->
  <text x="52" y="182" font-family="'Inter', 'Segoe UI', Ubuntu, sans-serif" font-size="14.5" fill="#94a3b8">
    Unindo precisão analítica de dados, automação industrial de missão crítica e engenharia de software.
  </text>

  <!-- Bottom Command Prompt Line -->
  <rect x="52" y="202" width="896" height="36" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
  <text x="68" y="225" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#38bdf8" font-weight="700">$</text>
  <text x="84" y="225" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#e2e8f0">
    echo $CORE_STACK
  </text>
  <text x="230" y="225" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#64748b">
    ──►
  </text>
  <text x="268" y="225" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#34d399">
    [ "Python", "FastAPI", "SQL Server", "Node.js", "React", "Docker", "Node-RED", "Sistemas MES" ]
  </text>
</svg>
