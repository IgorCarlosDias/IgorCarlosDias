name: Generate Pac-Man Contributions

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pacman-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate Pac-Man Arcade SVG
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: node .github/scripts/generate-pacman.mjs

      - name: Commit and Push if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pacman-contributions.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Pac-Man contributions graph [skip ci]"
            git push
          fi
